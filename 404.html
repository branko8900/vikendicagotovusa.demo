<!doctype html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Vikendica Gotovuša</title>
<meta name="robots" content="noindex">
<link rel="icon" href="https://branko8900.github.io/vikendicagotovusa.demo/assets/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --background:#ffffff; --foreground:#111613;
  --brand:#c22b1a;        /* trail-marker red */
  --brand-deep:#16261d;   /* pine — hero / numbers / footer */
  --brand-light:#e6b25c;  /* lamp-light amber */
  --accent-teal:#2e5a63;  /* lake teal caption tint */
  --surface:#f3f1ec; --surface-card:#ffffff;
  --ink:#111613; --ink-soft:#6e7268; --ghost:#dad6cc; --hairline:#e6e2d9; --on-brand:#ffffff;
  --radius-card:1.5rem; --radius-card-lg:2rem; --radius-pill:62.5rem;
  --ease-expo:cubic-bezier(.16,1,.3,1);
  --ease-quart:cubic-bezier(.25,1,.5,1);
  --ease-io:cubic-bezier(.65,0,.35,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0}
html{font-size:16px;-webkit-text-size-adjust:100%}
@media (max-width:1920px){html{font-size:.833333vw}}
@media (max-width:1440px){html{font-size:1.111111vw}}
@media (max-width:1024px){html{font-size:1.5625vw}}
@media (max-width:640px){html{font-size:4.444444vw}}
body{min-height:100vh;background:var(--background);color:var(--foreground);font-family:"Onest",system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%;height:auto}
button{cursor:pointer;font:inherit;color:inherit;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
ul{list-style:none;padding:0}
:focus-visible{outline:2px solid var(--brand-light);outline-offset:2px}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
.lenis.lenis-smooth [data-lenis-prevent]{overscroll-behavior:contain}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}

main{width:100%;overflow-x:clip;padding:.5rem}
@media (min-width:640px){main{padding:.75rem}}

/* ---------- reveal primitives ---------- */
.clip{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.14em;margin-bottom:-.14em;padding-top:.16em;margin-top:-.16em}
.clip.line{display:block}
.clip>span{display:inline-block;transform:translateY(115%);opacity:0;
  transition:transform var(--d,950ms) var(--ease-expo) var(--dl,0ms),opacity var(--d,950ms) var(--ease-expo) var(--dl,0ms)}
.is-in .clip>span{transform:none;opacity:1}
.no-tr,.no-tr *{transition:none!important}

/* ---------- shared ui ---------- */
.eyebrow{display:inline-flex;align-items:center;gap:.5rem;font-size:.75rem;font-weight:500;text-transform:uppercase;letter-spacing:.22em;color:var(--ink-soft)}
.eyebrow::before{content:"";width:.375rem;height:.375rem;border-radius:var(--radius-pill);background:var(--brand);flex:none}
.eyebrow.light{color:rgba(255,255,255,.7)}
.eyebrow.light::before{background:var(--brand-light)}

.pill{display:inline-flex;align-items:center;gap:.5rem;border-radius:var(--radius-pill);padding:.875rem 1.75rem;font-size:.875rem;font-weight:500;text-transform:uppercase;letter-spacing:.025em;white-space:nowrap;border:1px solid transparent;transition:background-color .25s,color .25s,border-color .25s}
.pill svg{width:1rem;height:1rem}
.pill.light{background:#fff;color:var(--brand-deep)}
.pill.light:hover{background:var(--brand-light);color:var(--ink)}
.pill.solid{background:var(--ink);color:#fff}
.pill.solid:hover{background:#2c4a38}
.pill.outline{border-color:currentColor;color:var(--ink)}
.pill.outline:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.pill:focus-visible{outline-color:var(--brand-light)}

.abtn{width:3rem;height:3rem;border-radius:var(--radius-pill);display:grid;place-items:center;border:1px solid var(--hairline);color:var(--ink);transition:background-color .25s,border-color .25s}
@media (min-width:640px){.abtn{width:3.5rem;height:3.5rem}}
.abtn svg{width:1.25rem;height:1.25rem}
.abtn.outline:hover{border-color:var(--ink)}
.abtn.solid{background:var(--ink);border-color:var(--ink);color:#fff}
.abtn.solid:hover{background:#2c4a38;border-color:#2c4a38}
.flip{display:grid;transform:scaleX(-1)}

.dots{display:flex;gap:.5rem;align-items:center}
.dot{padding:.375rem;display:grid}
.dot span{display:block;height:.375rem;width:.375rem;border-radius:var(--radius-pill);background:var(--ghost);transition:width .45s var(--ease-expo),background-color .3s}
.dot[aria-current="true"] span{width:1.25rem;background:var(--ink)}
.dots.light .dot span{background:rgba(255,255,255,.4)}
.dots.light .dot[aria-current="true"] span{background:#fff}

.brand{display:inline-flex;align-items:center;gap:.5rem;font-size:1rem;font-weight:500;text-transform:uppercase;letter-spacing:.2em;line-height:1}
.brand svg{width:1.25rem;height:1.25rem;flex:none}

.glass{border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.1);border-radius:var(--radius-card);padding:.75rem;box-shadow:0 .75rem 2rem rgba(22,38,29,.2);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}

.h2{font-size:3rem;font-weight:500;line-height:.95;letter-spacing:-.025em;margin-top:1rem}

/* ---------- hero ---------- */
.hero{position:relative;isolation:isolate;overflow:hidden;border-radius:var(--radius-card-lg);background:var(--brand-deep);color:#fff;height:calc(100svh - 1rem);min-height:36rem;display:flex;flex-direction:column}
@media (min-width:640px){.hero{height:calc(100svh - 1.5rem)}}
.hero-bg{position:absolute;inset:0;z-index:-10}
.hero-plate{position:absolute;left:0;right:0;top:-16%;height:132%;width:100%;will-change:transform}
.hero-plate picture{display:block;width:100%;height:100%}
.hero-plate img{width:100%;height:100%;object-fit:cover;object-position:50% 45%}
.hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(22,38,29,.65),rgba(22,38,29,.35),rgba(22,38,29,.78))}

.site-header{display:flex;align-items:center;padding:1.5rem 1.5rem 0;font-size:.75rem;color:#fff;position:relative;z-index:5}
@media (min-width:640px){.site-header{padding:2rem 2.5rem 0}}
.h-nav{display:none;flex:1;gap:2rem}
.h-nav a{color:rgba(255,255,255,.9);transition:color .2s}
.h-nav a:hover{color:#fff}
.h-brand{flex:1;display:flex}
@media (min-width:1024px){.h-nav{display:flex}.h-brand{justify-content:center}}
.h-right{flex:1;display:flex;justify-content:flex-end;align-items:center;gap:1rem}
@media (min-width:640px){.h-right{gap:1.25rem}}
.h-book{display:none;text-transform:uppercase;letter-spacing:.025em;text-underline-offset:.3em}
.h-book:hover{text-decoration:underline}
@media (min-width:640px){.h-book{display:inline}}
.burger{width:2.5rem;height:2.5rem;display:grid;place-content:center;gap:5px;border-radius:var(--radius-pill);background:rgba(255,255,255,.15);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:background-color .2s}
.burger:hover{background:rgba(255,255,255,.25)}
.burger span{display:block;width:1rem;height:1px;background:#fff}

.hero-title-wrap{padding:1rem 1.5rem 0}
@media (min-width:640px){.hero-title-wrap{padding-left:2.5rem;padding-right:2.5rem}}
.hero-title{font-size:calc(10.5vw * var(--k,1));font-weight:500;text-transform:uppercase;line-height:.85;letter-spacing:-.02em;white-space:nowrap}
@media (max-width:639px){.hero-title{font-size:calc(11vw * var(--k,1))}}

.hero-bottom{margin-top:auto;padding:0 1.5rem 2rem;display:flex;flex-direction:column;gap:1rem}
@media (min-width:640px){.hero-bottom{padding:0 2.5rem 2.5rem;flex-direction:row;justify-content:space-between;align-items:flex-end}}
.tagline{font-size:1.6rem;font-weight:500;text-transform:uppercase;line-height:.95;letter-spacing:-.02em;color:rgba(255,255,255,.85)}
.hero-cluster{display:flex;align-items:flex-end;gap:1rem}
.coll{display:none;width:16rem;flex-direction:column;gap:.75rem}
@media (min-width:768px){.coll{display:flex}}
.coll-stage{position:relative}
.coll-card{display:flex;gap:.75rem;align-items:center}
.coll-card.leaving{position:absolute;left:0;top:0;width:100%;pointer-events:none}
.coll-card img{width:3.5rem;height:3.5rem;border-radius:.75rem;object-fit:cover;flex:none}
.c-txt{min-width:0}
.c-brand{font-size:.7rem;font-weight:500;text-transform:uppercase;letter-spacing:.025em;line-height:1.3;color:var(--brand-light)}
.c-title{font-size:.7rem;text-transform:uppercase;opacity:.8;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-cta{display:inline-block;font-size:.65rem;text-decoration:underline;text-underline-offset:2px;margin-top:.25rem}
.member{width:100%;max-width:13.5rem;display:flex;gap:.75rem;align-items:stretch}
@media (min-width:640px){.member{max-width:13rem}}
.m-left{flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:.5rem}
.m-val{font-size:1.5rem;font-weight:500;line-height:1}
.avs{display:flex}
.avs span{width:1rem;height:1rem;border-radius:var(--radius-pill);border:1px solid rgba(22,38,29,.4)}
.avs span+span{margin-left:-.5rem}
.m-cap{font-size:.65rem;opacity:.8;line-height:1.3}
.m-img{width:3.25rem;aspect-ratio:3/4;border-radius:.75rem;object-fit:cover;flex:none}

/* ---------- trust ---------- */
.trust{position:relative;isolation:isolate;overflow:hidden;background:var(--background);padding:4rem 1.5rem}
@media (min-width:640px){.trust{padding:5rem 2.5rem}}
.trust-top{position:relative;z-index:20;display:flex;flex-direction:column;gap:1.5rem}
@media (min-width:640px){.trust-top{flex-direction:row;justify-content:space-between;align-items:flex-start}}
.pct{width:7rem;height:7rem;border-radius:var(--radius-pill);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;flex:none}
@media (min-width:640px){.pct{width:8rem;height:8rem}}
.pct b{font-size:1.5rem;font-weight:500;line-height:1.1}
.pct small{font-size:.6rem;color:var(--ink-soft);max-width:7em;line-height:1.3;margin-top:.25rem}
.badge{max-width:28rem;display:flex;gap:1rem;border-radius:var(--radius-card);background:var(--surface);padding:1.25rem}
@media (min-width:640px){.badge{gap:1.25rem;padding:1.5rem}}
.badge-idx{align-self:flex-start;border-radius:.75rem;background:var(--background);padding:.5rem 1rem;font-size:1.25rem;font-weight:500;line-height:1.4}
.badge h3{font-size:1.125rem;font-weight:500;line-height:1.3}
.badge p{font-size:.75rem;color:var(--ink-soft);line-height:1.625;margin-top:.375rem}
.ghost{pointer-events:none;position:relative;z-index:0;user-select:none;-webkit-user-select:none;max-width:88rem;margin:3rem auto 0;font-size:8.2vw;font-weight:500;text-transform:uppercase;line-height:1.02;letter-spacing:-.02em;color:var(--ghost)}
.ghost .row{display:flex;justify-content:space-between;gap:.3em}
.gw{display:inline-block;will-change:transform}
.gw .clip{padding-bottom:.12em;margin-bottom:-.12em}
.gw.ink{color:var(--ink)}
.coach-pos{position:relative;z-index:10;width:13rem;margin:2.5rem auto 0}
@media (min-width:640px){.coach-pos{position:absolute;left:50%;top:50%;width:16rem;margin:0;transform:translate(-50%,-50%)}}
.coach{position:relative;transform:rotate(6deg);aspect-ratio:3/4;border-radius:var(--radius-card);background:var(--brand);overflow:hidden;box-shadow:0 1.5rem 3rem rgba(22,38,29,.18)}
.coach-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cap{position:absolute;left:.75rem;right:.75rem;bottom:.75rem;border-radius:.75rem;background:rgba(22,38,29,.4);color:#fff;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding:.5rem .75rem;line-height:1.3}
.cap b{display:block;font-size:.875rem;font-weight:500}
.cap small{font-size:.65rem;opacity:.8}
.t-ctrls{position:relative;z-index:20;margin-top:3rem;display:flex;justify-content:space-between;align-items:center}
@media (min-width:640px){.t-ctrls{margin-top:6rem}}

/* ---------- meni (programs) ---------- */
.programs{background:var(--surface);padding:6rem 1.5rem}
@media (min-width:640px){.programs{padding-left:2.5rem;padding-right:2.5rem}}
.p-list{margin-top:3.5rem}
.p-list li{border-top:1px solid var(--hairline)}
.p-list li:last-child{border-bottom:1px solid var(--hairline)}
.p-row{display:block;outline-offset:-2px}
.p-row:focus-visible{background:var(--background)}
.p-in{display:flex;align-items:center;gap:1.5rem;padding:1.75rem 0}
.p-idx{width:2.5rem;flex:none;font-size:.875rem;font-weight:500;color:var(--ink-soft)}
.p-txt{flex:1;min-width:0}
.p-name{font-size:1.5rem;font-weight:500;letter-spacing:-.025em;line-height:1.15}
@media (min-width:640px){.p-name{font-size:1.875rem}}
.p-desc{font-size:.875rem;color:var(--ink-soft);margin-top:.375rem}
.p-arrow{width:2.75rem;height:2.75rem;flex:none;border-radius:var(--radius-pill);border:1px solid var(--hairline);display:grid;place-items:center}
.p-arrow svg{width:1.25rem;height:1.25rem}
.p-more{display:inline-flex;margin-top:2rem;font-size:.875rem;font-weight:500;text-decoration:underline;text-underline-offset:.3em}
.p-more:hover{color:var(--brand)}

/* ---------- lokacija (facilities) ---------- */
.facil{position:relative;z-index:1;background:var(--background);border-radius:var(--radius-card-lg);margin-top:-2.5rem;padding:4rem 1.5rem 5rem}
@media (min-width:640px){.facil{padding-left:2.5rem;padding-right:2.5rem}}
.f-grid{display:grid;gap:2.5rem;align-items:end}
@media (min-width:768px){.f-grid{grid-template-columns:1fr 1fr}}
.f-intro{max-width:24rem}
.f-icon{width:4rem;height:4rem;border-radius:var(--radius-card);object-fit:cover}
.f-intro .h2{margin-top:1.5rem}
.f-body{font-size:.875rem;color:var(--ink-soft);max-width:20rem;margin-top:1.5rem}
.f-body .w{display:inline-block;transform:translateY(18px);opacity:0;transition:transform 700ms var(--ease-quart),opacity 700ms var(--ease-quart)}
.f-body.is-in .w{transform:none;opacity:1}
.f-hours{margin-top:1.5rem;font-size:.875rem;display:grid;gap:.25rem;max-width:20rem}
.f-hours div{display:flex;justify-content:space-between;border-bottom:1px solid var(--hairline);padding:.375rem 0}
.f-hours dt{color:var(--ink-soft)}
.f-hours dd{font-weight:500}
.f-cards{display:flex;align-items:flex-end;gap:1.25rem}
.f-card{flex:1;min-width:0}
.f-card:nth-child(2){margin-bottom:2rem}
.tile{position:relative;display:block;aspect-ratio:3/4;border-radius:var(--radius-card);overflow:hidden;background:var(--surface);isolation:isolate}
.tile img{width:100%;height:100%;object-fit:cover}
.cap2{position:absolute;left:.75rem;right:.75rem;bottom:.75rem;border-radius:.75rem;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;padding:.75rem 1rem;line-height:1.35}
.cap2 b{display:block;font-size:.875rem;font-weight:500}
.cap2 small{display:block;font-size:.65rem;opacity:.85;margin-top:.125rem}
.tone-clay .cap2{background:rgba(22,38,29,.4)}
.tone-blue .cap2{background:rgba(46,90,99,.55)}
.stretch::after{content:"";position:absolute;inset:0;z-index:1}

/* ---------- brojke (stats) ---------- */
.stats{background:var(--brand-deep);color:#fff;border-radius:var(--radius-card-lg);margin-top:.75rem;padding:5rem 1.5rem}
@media (min-width:640px){.stats{padding-left:2.5rem;padding-right:2.5rem}}
.s-grid{display:grid;grid-template-columns:repeat(2,1fr);column-gap:2rem;row-gap:3rem;margin-top:4rem}
@media (min-width:1024px){.s-grid{grid-template-columns:repeat(4,1fr)}}
.s-cell{border-top:1px solid rgba(255,255,255,.2);padding-top:1.25rem}
.s-val{font-size:3.75rem;font-weight:500;letter-spacing:-.025em;line-height:1}
@media (min-width:640px){.s-val{font-size:4.5rem}}
.s-val em{font-style:normal;color:var(--brand-light)}
.s-lab{font-size:.875rem;color:rgba(255,255,255,.65);margin-top:.75rem}

/* ---------- objave (testimonials) ---------- */
.testi{background:var(--background);padding:5rem 1.5rem}
@media (min-width:640px){.testi{padding:6rem 2.5rem}}
.t-grid{display:grid;gap:1.25rem;margin-top:3.5rem}
@media (min-width:768px){.t-grid{grid-template-columns:repeat(3,1fr)}}
.t-grid>li>div{height:100%}
.t-card{display:flex;flex-direction:column;justify-content:space-between;height:100%;border-radius:var(--radius-card);background:var(--surface);padding:1.75rem}
.q{font-size:2.25rem;color:var(--brand);line-height:1;font-weight:500}
.t-card blockquote{font-size:1.125rem;line-height:1.625;color:var(--ink);margin-top:1rem}
.t-card figcaption{border-top:1px solid var(--hairline);padding-top:1rem;margin-top:1.5rem;line-height:1.4}
.t-card figcaption b{display:block;font-weight:500}
.t-card figcaption small{font-size:.875rem;color:var(--ink-soft)}

/* ---------- footer ---------- */
.footer{background:var(--brand-deep);color:#fff;border-radius:var(--radius-card-lg);margin-top:.75rem;padding:3.5rem 1.5rem}
@media (min-width:640px){.footer{padding:4rem 2.5rem}}
.cta-band{border-bottom:1px solid rgba(255,255,255,.15);padding-bottom:3.5rem;display:flex;flex-direction:column;gap:2rem}
@media (min-width:640px){.cta-band{flex-direction:row;justify-content:space-between;align-items:flex-end}}
.cta-big{font-size:3.75rem;font-weight:500;line-height:.92;letter-spacing:-.025em;margin-top:1rem}
.f-cols{padding:3.5rem 0;display:grid;gap:2.5rem}
@media (min-width:768px){.f-cols{grid-template-columns:1.4fr 1fr 1fr 1fr}}
.f-brand{max-width:20rem}
.f-brand .brand{font-size:1.125rem}
.f-blurb{font-size:.875rem;color:rgba(255,255,255,.65);margin-top:1rem}
.footer address{font-style:normal;margin-top:1.5rem;color:rgba(255,255,255,.8);font-size:.875rem;display:flex;flex-direction:column;gap:.25rem}
.footer address a:hover{color:#fff;text-decoration:underline;text-underline-offset:.25em}
.footer address .muted{color:rgba(255,255,255,.55)}
.f-col h3{font-size:.75rem;font-weight:500;text-transform:uppercase;letter-spacing:.2em;color:rgba(255,255,255,.5)}
.f-col ul{margin-top:1rem;font-size:.875rem;color:rgba(255,255,255,.8);display:grid;gap:.75rem}
.f-col a:hover{color:#fff}
.f-bottom{border-top:1px solid rgba(255,255,255,.15);padding-top:2rem;font-size:.875rem;color:rgba(255,255,255,.6);display:flex;flex-direction:column;gap:1.25rem}
@media (min-width:640px){.f-bottom{flex-direction:row;justify-content:space-between;align-items:center}}
.f-bottom nav{display:flex;gap:1.25rem}
.f-bottom a:hover{color:#fff}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:90;display:flex;align-items:flex-end;justify-content:center;padding:.75rem;pointer-events:none}
@media (min-width:640px){.modal{align-items:center;padding:1.5rem}}
.modal.open{pointer-events:auto}
.m-back{position:absolute;inset:0;background:rgba(22,38,29,.4);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0}
.m-panel{position:relative;width:100%;max-height:92svh;overflow-y:auto;border-radius:var(--radius-card-lg);background:var(--surface-card);padding:1.5rem;color:var(--ink);box-shadow:0 2rem 5rem rgba(22,38,29,.35);opacity:0}
@media (min-width:640px){.m-panel{max-width:32rem;padding:2rem}}
.m-head{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem}
.m-title{font-size:2.25rem;font-weight:500;line-height:.95;letter-spacing:-.025em;margin-top:.75rem}
@media (min-width:640px){.m-title{font-size:3rem}}
.x-btn{width:2.5rem;height:2.5rem;flex:none;border-radius:var(--radius-pill);display:grid;place-items:center;background:var(--surface);transition:background-color .2s}
.x-btn:hover{background:var(--hairline)}
.x-btn svg{width:1.125rem;height:1.125rem}
.m-form{margin-top:1.75rem;display:flex;flex-direction:column;gap:1rem}
.field{display:flex;flex-direction:column;gap:.5rem}
.field>span{font-size:.75rem;font-weight:500;text-transform:uppercase;letter-spacing:.18em;color:var(--ink-soft)}
.input{width:100%;border-radius:.75rem;border:1px solid var(--hairline);background:var(--background);padding:.75rem 1rem;font:inherit;font-size:max(16px,.875rem);min-height:2.9rem;color:var(--ink);outline:none;transition:border-color .2s,box-shadow .2s;resize:vertical}
.input:focus{border-color:var(--brand-light);box-shadow:0 0 0 3px rgba(230,178,92,.3)}
.submit{align-self:flex-start;margin-top:.5rem;border-radius:var(--radius-pill);background:var(--ink);color:#fff;padding:.875rem 1.75rem;font-size:.875rem;font-weight:500;text-transform:uppercase;letter-spacing:.025em;transition:background-color .25s,opacity .25s}
.submit:hover{background:#2c4a38}
.submit:disabled{opacity:.55;cursor:default;background:var(--ink)}
.m-note{font-size:.75rem;color:var(--ink-soft)}
.m-note a{text-decoration:underline;text-underline-offset:.2em}
.success{margin-top:2rem;border-radius:var(--radius-card);background:var(--surface);padding:1.5rem;text-align:center}
.check{width:3rem;height:3rem;border-radius:var(--radius-pill);background:var(--brand);color:#fff;display:grid;place-items:center;margin:0 auto}
.check svg{width:1.4rem;height:1.4rem}
.success h3{font-size:1.125rem;font-weight:500;margin-top:1rem}
.success p{font-size:.875rem;color:var(--ink-soft);margin-top:.375rem}
.success .submit{align-self:auto;margin-top:1.25rem}

/* ---------- menu overlay ---------- */
.menu{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;pointer-events:none;color:#fff}
.menu.open{pointer-events:auto}
.menu-back{position:absolute;inset:0;background:var(--brand-deep);opacity:0}
.menu-panel{position:relative;flex:1;display:flex;flex-direction:column;padding:.5rem;opacity:0}
@media (min-width:640px){.menu-panel{padding:.75rem}}
.menu-inner{flex:1;display:flex;flex-direction:column;padding:1.5rem}
@media (min-width:640px){.menu-inner{padding:2rem 2.5rem}}
.menu-top{display:flex;justify-content:space-between;align-items:center}
.menu .x-btn{background:rgba(255,255,255,.15)}
.menu .x-btn:hover{background:rgba(255,255,255,.25)}
.menu-nav{flex:1;display:flex;flex-direction:column;justify-content:center;gap:.5rem;padding:2rem 0}
.menu-nav a{display:block;font-size:3rem;font-weight:500;letter-spacing:-.025em;line-height:1.05;transition:color .2s}
@media (min-width:640px){.menu-nav a{font-size:4.5rem}}
.menu-nav a:hover{color:var(--brand-light)}
.menu-bottom{border-top:1px solid rgba(255,255,255,.15);padding-top:2rem;display:flex;flex-direction:column;gap:1.5rem;align-items:flex-start}
@media (min-width:640px){.menu-bottom{flex-direction:row;justify-content:space-between;align-items:center}}
.menu-social{display:flex;gap:1.25rem;font-size:.875rem;color:rgba(255,255,255,.7)}
.menu-social a:hover{color:#fff}

/* ---------- loader ---------- */
.loader{position:fixed;inset:0;z-index:200;background:var(--brand-deep);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2rem}
.l-mark{display:flex;align-items:center;gap:.75rem;font-size:1.5rem;font-weight:500;text-transform:uppercase;letter-spacing:.2em;opacity:0}
.l-mark svg{width:1.75rem;height:1.75rem}
.l-track{width:10rem;height:1px;border-radius:var(--radius-pill);background:rgba(255,255,255,.2);overflow:hidden}
.l-fill{height:100%;background:#fff;transform:scaleX(0);transform-origin:left;transition:transform 1280ms var(--ease-io) 120ms}
.loader.go .l-fill{transform:scaleX(1)}

@media (prefers-reduced-motion:reduce){
  .clip>span,.f-body .w{transition-duration:1ms!important;transition-delay:0ms!important}
  .l-fill{transition-duration:150ms;transition-delay:0ms}
}

/* ---------- cottage additions ---------- */
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.f-row.three{grid-template-columns:1fr 1fr 5.5rem}
@media (max-width:639px){.f-row.three{grid-template-columns:1fr 1fr}.f-row.three .field:last-child{grid-column:1/-1}}
select.input{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%);background-position:calc(100% - 1.1rem) 52%,calc(100% - .8rem) 52%;background-size:.3rem .3rem;background-repeat:no-repeat;padding-right:2rem}
.input[aria-invalid="true"]{border-color:var(--brand)}
.err{font-size:.75rem;color:var(--brand);min-height:0}
.err:empty{display:none}
.m-actions{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;margin-top:.5rem}
.m-actions .submit{margin-top:0}
.submit.line{background:transparent;color:var(--ink);border:1px solid var(--hairline)}
.submit.line:hover{background:var(--surface);border-color:var(--ink)}
.submit .ic{width:1rem;height:1rem;display:inline-block;vertical-align:-.15em;margin-right:.4rem}
.p-more{color:var(--ink)}
.cyr{font-size:1.25rem;line-height:1.35}
/* 404 */
.nf{position:relative;isolation:isolate;overflow:hidden;border-radius:var(--radius-card-lg);background:var(--brand-deep);color:#fff;min-height:calc(100svh - 1rem);display:flex;flex-direction:column;justify-content:flex-end;padding:1.5rem}
@media (min-width:640px){.nf{min-height:calc(100svh - 1.5rem);padding:2.5rem}}
.nf img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.nf::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to bottom,rgba(22,38,29,.55),rgba(22,38,29,.35),rgba(22,38,29,.85))}
.nf .brand{position:absolute;top:1.5rem;left:1.5rem}
@media (min-width:640px){.nf .brand{top:2rem;left:2.5rem}}
.nf-code{font-size:30vw;font-weight:500;line-height:.8;letter-spacing:-.04em}
.nf h1{font-size:2.4rem;font-weight:500;text-transform:uppercase;line-height:.95;letter-spacing:-.02em;margin-top:1.5rem}
.nf p{color:rgba(255,255,255,.75);margin-top:.5rem}
.nf-act{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:2rem}

.skip-link:focus{position:fixed;left:1rem;top:1rem;z-index:300;width:auto;height:auto;clip:auto;margin:0;padding:.75rem 1rem;background:#fff;color:var(--ink);border-radius:.75rem}
@media (min-width:640px){.tagline{font-size:1.9rem}}
.member.glass{padding:.625rem}
</style>
